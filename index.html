</head>
<body>
    <div class="container">
        <h2>Ash_G_OTW Links</h2>
        <a href="https://twitch.tv/ash_g_otw" target="_blank">Twitch</a>
        <a href="https://youtube.com/@Ash_G_OTW" target="_blank">YouTube</a>

    <iframe id="latest-video" src="" title="Latest YouTube Video" allowfullscreen></iframe>
</div>

<script>
    // Replace with your YouTube Channel ID (starts with UC...)
    const channelId = "Ash_G_OTW";
    const rssUrl = `https://www.youtube.com/@Ash_G_OTW/shorts`;
    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

    fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
            if (data.items && data.items.length > 0) {
                // Grabs the most recent video (index 0)
                const latestVideo = data.items[0];
                const videoId = latestVideo.link.split("=")[1];
                document.getElementById("latest-video").src = `https://www.youtube.com/embed/${videoId}`;
            }
        })
        .catch(error => console.error("Error loading feed:", error));
</script>
</body>
